{% extends "base.html" %}

{% block title %}Archive{% endblock %}

{% block content %}

<h1>Archiv (48h+)</h1>

<a href="/news" class="btn" style="margin-bottom: 20px;">
    ← Zurück zu aktuellen News
</a>

<div style="display:flex; flex-direction:column; gap:12px;">

{% for n in notifications %}

<a href="/news/read/{{ n.id }}" style="text-decoration:none; color:inherit;">

<div style="
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: {% if n.read == 0 %}4px solid #6366f1{% else %}1px solid var(--border){% endif %};
    border-radius: 14px;
    padding: 14px;
    transition: 0.2s;
">

    <div style="font-weight:800;">
        {{ n.sender }}
    </div>

    <div style="font-size:13px; color: var(--text-dim);">
        {{ n.message }}
    </div>

</div>

</a>

{% endfor %}

</div>

{% endblock %}
