{% extends "base.html" %}
{% block title %}Registrieren{% endblock %}

{% block content %}
<h2>🧾 Account erstellen</h2>

{% if message %}
<p>{{ message }}</p>
{% endif %}

<form method="post">
    <input name="username" placeholder="Username" required><br>
    <input name="password" type="password" placeholder="Passwort" required><br>
    <input name="server_key" type="password" placeholder="Server-Key" required><br>
    <button>Account erstellen</button>
</form>
{% endblock %}
