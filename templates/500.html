<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Failure</title>
  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: #e6e6e6;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      max-width: 900px;
      border: 1px solid #2a2f36;
      padding: 24px;
      background: #0f1620;
    }
    .critical {
      color: #ff4d4d;
      font-weight: bold;
      margin-bottom: 16px;
    }
    ul {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="box" id="content"></div>  <script>
    const lang = localStorage.getItem("lang") || "en";

    const messages = {
      eng: `
<div class="critical">[CRITICAL SYSTEM FAILURE]</div>
Core application instability detected.<br><br>
This message is shown on all routes because normal operation cannot be guaranteed.<br><br>
If you are seeing this:
<ul>
  <li>the system is partially or fully degraded</li>
  <li>routing is unreliable</li>
  <li>recovery attempts may already be in progress</li>
</ul>
DO NOT rely on any functionality.<br>
Contact the administrator immediately.
      `,

      deu: `
<div class="critical">[KRITISCHER SYSTEMAUSFALL]</div>
Instabilität der Hauptanwendung erkannt.<br><br>
Diese Meldung wird auf allen Routen angezeigt, da der normale Betrieb nicht mehr garantiert werden kann.<br><br>
Falls du das siehst:
<ul>
  <li>das System ist teilweise oder vollständig beeinträchtigt</li>
  <li>Routing ist nicht zuverlässig</li>
  <li>Wiederherstellungsversuche laufen möglicherweise bereits</li>
</ul>
VERLASS DICH AUF KEINE FUNKTION.<br>
Kontaktiere sofort den Administrator.
      `
    };

    document.getElementById("content").innerHTML = messages[lang] || messages.eng;
  </script></body>
</html>
