<!DOCTYPE html><html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="errors.500.fatal_title">System Failure</title>
  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: #e6e6e6;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      max-width: 900px;
      border: 1px solid #2a2f36;
      padding: 24px;
      background: #0f1620;
    }
    .critical {
      color: #ff4d4d;
      font-weight: bold;
      margin-bottom: 16px;
    }
    ul {
      margin-top: 12px;
    }
  </style>
</head>
<body data-page="500">
  <script>
    (function(){
        var LANG_MAP = { deu: "de", eng: "en" };
        var lang = localStorage.getItem("serverjonas_lang");
        document.documentElement.setAttribute("lang", LANG_MAP[lang] || "de");
    })();
  </script>
  <div class="box" id="content"></div>
  <script>
    const T = {
        kritisch: {
            deu: "[KRITISCHER SYSTEMAUSFALL]",
            eng: "[CRITICAL SYSTEM FAILURE]",
            spa: "[FALLO CRÍTICO DEL SISTEMA]",

            nld: "[KRITIEKE STORING]",

        instabil: {
            deu: "Instabilität der Hauptanwendung erkannt.",
            eng: "Core application instability detected.",

            ita: "Rilevata instabilità dell'applicazione principale.",

            por: "Instabilidade da aplicação principal detetada.",
            pol: "Wykryto niestabilność głównej aplikacji.",
            rus: "Обнаружена нестабильность основного приложения."
        },
        hinweis: {
            deu: "Diese Meldung wird auf allen Routen angezeigt, da der normale Betrieb nicht mehr garantiert werden kann.",
            eng: "This message is shown on all routes because normal operation cannot be guaranteed.",
            spa: "Este mensaje se muestra en todas las rutas porque no se puede garantizar el funcionamiento normal.",
            fra: "Ce message s'affiche sur toutes les routes car le fonctionnement normal ne peut être garanti.",
            ita: "Questo messaggio viene mostrato su tutte le rotte perché il normale funzionamento non può essere garantito.",

        falls: {
            deu: "Falls du das siehst:",
            eng: "If you are seeing this:",
            spa: "Si estás viendo esto:",
            fra: "Si tu vois ceci :",
            ita: "Se vedi questo:",
            nld: "Als je dit ziet:",
            por: "Se estás a ver isto:",
            pol: "Jeśli to widzisz:",
            rus: "Если ты это видишь:"
        },
        s1: {
            deu: "das System ist teilweise oder vollständig beeinträchtigt",
            eng: "the system is partially or fully degraded",
            spa: "el sistema está parcial o totalmente degradado",
            fra: "le système est partiellement ou totalement dégradé",
            ita: "il sistema è parzialmente o completamente compromesso",
            nld: "het systeem is gedeeltelijk of volledig aangetast",

        },
        verlass: {

            deu: "Kontaktiere sofort den Administrator.",

            pol: "Skontaktuj się natychmiast z administratorem.",
            rus: "Немедленно свяжись с администратором."

    function tr(key, lang){
        return (T[key] && T[key][lang]) || T[key]['deu'];
    }

    const lang = localStorage.getItem("serverjonas_lang") || "deu";

    document.getElementById("content").innerHTML = `
<div class="critical">${tr("kritisch", lang)}</div>
${tr("instabil", lang)}<br><br>
${tr("hinweis", lang)}<br><br>
${tr("falls", lang)}
<ul>
  <li>${tr("s1", lang)}</li>
  <li>${tr("s2", lang)}</li>
  <li>${tr("s3", lang)}</li>
</ul>
${tr("verlass", lang)}<br>
${tr("kontakt", lang)}
    `;
  </script>
</body>
</html>
