{% extends "base.html" %}
{% block title %}Upload · serverjonas{% endblock %}
{% block head %}
<style>
.upload-form {
    max-width: 600px;
    margin: 0 auto;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 32px;
    border: 1px solid rgba(255,255,255,0.1);
}
.form-group { margin-bottom: 20px; }
label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.88em;
    opacity: 0.75;
}
input[type="text"], input[type="number"], input[type="file"] {
    width: 100%;
    padding: 10px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: white;
    font-size: 0.95em;
    box-sizing: border-box;
}
input[type="file"] { cursor: pointer; }
input:focus { outline: none; border-color: rgba(255,255,255,0.4); }
.type-toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
.toggle-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: white;
    cursor: pointer;
    font-size: 0.9em;
    text-align: center;
    transition: 0.2s;
}
.toggle-btn.active {
    border-color: rgba(99,179,237,0.6);
    background: rgba(99,179,237,0.15);
}
.series-fields { display: none; }
.series-fields.visible { display: block; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.submit-btn {
    width: 100%;
    padding: 12px;
    background: rgba(99,179,237,0.25);
    border: 1px solid rgba(99,179,237,0.4);
    color: white;
    border-radius: 10px;
    font-size: 1em;
    cursor: pointer;
    transition: 0.2s;
}
.submit-btn:hover { background: rgba(99,179,237,0.4); }
.msg {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 0.9em;
}
.msg-error { background: rgba(220,53,69,0.2); border: 1px solid rgba(220,53,69,0.4); }
.msg-info { background: rgba(99,179,237,0.2); border: 1px solid rgba(99,179,237,0.4); }
.back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    font-size: 0.9em;
}
.back-link:hover { color: white; }
</style>
{% endblock %}
{% block content %}
<a href="{{ url_for('films.index') }}" class="back-link">← Zurück</a>
<h1>⬆️ Upload</h1>
<p>Film oder Serienepisode hochladen</p>

<div class="upload-form">
    {% if message %}
    <div class="msg msg-{{ message_type }}">{{ message }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <!-- Typ-Toggle -->
        <div class="type-toggle">
            <div class="toggle-btn active" id="btn-film" onclick="setType('film')">🎥 Film</div>
            <div class="toggle-btn" id="btn-series" onclick="setType('series')">📺 Serie</div>
        </div>
        <input type="hidden" name="upload_type" id="upload_type" value="film">

        <div class="form-group">
            <label>Titel</label>
            <input type="text" name="title" placeholder="z.B. Inception" required>
        </div>

        <!-- Serien-Felder -->
        <div class="series-fields" id="series-fields">
            <div class="form-group">
                <label>Serienname</label>
                <input type="text" name="series_name" id="series_name" placeholder="z.B. Breaking Bad">
            </div>
            <div class="row2">
                <div class="form-group">
                    <label>Staffel</label>
                    <input type="number" name="season" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Episode</label>
                    <input type="number" name="episode" value="1" min="1">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Videodatei</label>
            <input type="file" name="file" accept="video/*" required>
        </div>

        <button type="submit" class="submit-btn">🚀 Hochladen & Konvertieren</button>
    </form>
</div>

<script>
function setType(type) {
    document.getElementById('upload_type').value = type;
    document.getElementById('btn-film').classList.toggle('active', type === 'film');
    document.getElementById('btn-series').classList.toggle('active', type === 'series');
    document.getElementById('series-fields').classList.toggle('visible', type === 'series');
    document.getElementById('series_name').required = (type === 'series');
}
</script>
{% endblock %}
