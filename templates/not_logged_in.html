<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Nicht eingeloggt</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            color: #38bdf8;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.2rem;
            margin: 20px 0 40px 0;
            color: #94a3b8;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .buttons a {
            display: inline-block;
            padding: 12px 28px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
            min-width: 180px;
        }

        .buttons a:hover {
            background: #0ea5e9;
            transform: scale(1.05);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️</h1>
        <p>Du musst angemeldet sein, um auf diese Seite zuzugreifen.</p>

        <div class="buttons">
            <a href="/">Zurück zum Hub</a>
            <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
