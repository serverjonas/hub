<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}serverjonas HUB{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">

    <!-- Globaler Style -->
    <style>
    body {
        margin: 0;
        font-family: system-ui, monospace;
        color: white;
        min-height: 100vh;
        background: linear-gradient(
            225deg,
            #0d0e12 0%,
            #0f2027 50%,
            #203a43 80%,
            #2c5364 100%
        );
    }
    #logo {
        position: absolute;
        top: 10px;
        right: 10px;
        max-width: 200px;
        width: 100%;
        height: auto;
        z-index: 1000;
    }
    @media (max-width: 768px) and (orientation: portrait) {
        #logo { width: 100px; }
    }
    @media (max-width: 768px) and (orientation: landscape) {
        #logo { width: 200px; }
    }
    .container {
        max-width: 900px;
        margin: auto;
        padding: 40px;
    }
    h1 { text-align: center; font-size: 3em; margin-bottom: 10px; position: relative; z-index: 2000; }
    p { text-align: center; opacity: 0.8; }
    .grid {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
    }
    .card {
        background: rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 25px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
    }
    .card:hover {
        background: rgba(255,255,255,0.2);
        transform: translateY(-5px);
    }
    .card span { font-size: 2em; }
    .footer { text-align: center; margin-top: 50px; font-size: 0.9em; opacity: 0.6; }

    .support-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #0d6efd;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 9999;
    }

    .support-button:hover {
      background: #084298;
    }

    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Globale Navigationsleiste -->
    <nav style="background: rgba(0,0,0,0.6); padding: 0 20px 20px 20px; display: flex; gap: 15px; position: sticky; top: 10; z-index: 999; align-items: flex-end; height: 100px;">
        <a href="https://nextcloud.serverjonas.de" style="color: white; text-decoration: none;">Nextcloud</a>
        <a href="https://serverjonas.de/memes" style="color: white; text-decoration: none;">Memes</a>
        <a href="https://serverjonas.de/films" style="color: white; text-decoration: none;">Media</a>
        <a href="https://serverjonas.de/friends" style="color: white; text-decoration: none;">Freunde</a>
    </nav>
    <!-- Logo global klickbar -->
    <a href="/">
        <img id="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    </a>

    <!-- Kundensupport Button global -->
    <a href="https://support.serverjonas.de" target="_blank" class="support-button">
      🛠 Kundensupport
    </a>

    <!-- Hauptcontent -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer global -->
    <div class="footer">
        powered by Linux · serverjonas · no iSchrott
    </div>
</body>
</html>
