<!doctype html>
<html lang="de" data-theme="dark" data-style="vibcodet">
    <head>
        <meta charset="UTF-8" />
        <title>{% block title %}Serverjonas{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" />
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Libre+Baskerville:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest"></script>
        <style>
            :root {
                --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                
                /* Default Dark Theme */
                --bg: #0e0e10;
                --surface: rgba(255, 255, 255, 0.05);
                --surface-hover: rgba(255, 255, 255, 0.1);
                --border: rgba(255, 255, 255, 0.08);
                --text-main: #ffffff;
                --text-dim: #a0a0a0;
                --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
                --glass-bg: rgba(14, 14, 16, 0.8);
                --card-shadow: 0 20px 50px rgba(0,0,0,0.3);
            }

            /* OLED Theme */
            [data-theme="oled"] {
                --bg: #000000;
                --surface: #121212;
                --surface-hover: #1a1a1a;
                --border: #222222;
                --glass-bg: rgba(0, 0, 0, 0.9);
            }

            /* Light Theme */
            [data-theme="light"] {
                --bg: #f8fafc;
                --surface: rgba(0, 0, 0, 0.04);
                --surface-hover: rgba(0, 0, 0, 0.07);
                --border: rgba(0, 0, 0, 0.06);
                --text-main: #0f172a;
                --text-dim: #64748b;
                --glass-bg: rgba(255, 255, 255, 0.85);
                --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
            }

            /* Paper Theme (Claude-like) */
            [data-theme="paper"] {
                --bg: #f5f2ed;
                --surface: #ffffff;
                --surface-hover: #faf9f6;
                --border: #e6e0d4;
                --text-main: #1a1a18;
                --text-dim: #6b6b63;
                --accent-gradient: #d97706; /* Warm amber */
                --glass-bg: rgba(245, 242, 237, 0.9);
                --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            }
            [data-theme="paper"] body { font-family: 'Inter', serif; }
            [data-theme="paper"] h1, [data-theme="paper"] h2, [data-theme="paper"] .brand { font-family: 'Libre+Baskerville', serif; font-weight: 400; }
            [data-theme="paper"] .btn-primary { background: #1a1a18 !important; color: #f5f2ed; }
            [data-theme="paper"] .nav-links a:hover { color: #d97706; }
            [data-theme="paper"] .bg-glow { opacity: 0.3; filter: grayscale(1); }

            /* Clean Style */
            [data-style="clean"] {
                --accent-gradient: #6366f1;
                --transition: all 0.2s ease;
                --card-shadow: none;
                --glass-bg: var(--bg);
            }
            [data-style="clean"] .bg-glow { display: none; }
            [data-style="clean"] body { font-family: 'Space Grotesk', sans-serif; }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                background-color: var(--bg);
                color: var(--text-main);
                font-family: "Inter", system-ui, -apple-system, sans-serif;
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
                min-height: 100vh;
                transition: background-color 0.4s ease, color 0.4s ease;
            }

            h1, h2, h3, .brand { font-family: "Montserrat", sans-serif; }

            .bg-glow {
                position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                z-index: -1; pointer-events: none; overflow: hidden;
            }

            .bg-glow::before {
                content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
                background: radial-gradient(circle at 70% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                            radial-gradient(circle at 30% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
                animation: rotate 60s linear infinite;
            }

            @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

            nav {
                position: fixed; top: 0; width: 100%; height: 72px;
                display: flex; align-items: center; justify-content: space-between;
                padding: 0 40px; background: var(--glass-bg); backdrop-filter: blur(20px);
                border-bottom: 1px solid var(--border); z-index: 1000;
            }

            .brand {
                font-weight: 800; font-size: 20px; letter-spacing: -1px;
                text-decoration: none; color: var(--text-main); display: flex; align-items: center; gap: 10px;
            }

            .nav-right { display: flex; align-items: center; gap: 20px; }
            .nav-links { display: flex; gap: 24px; }
            .nav-links a { text-decoration: none; color: var(--text-dim); font-size: 14px; font-weight: 500; transition: var(--transition); }
            .nav-links a:hover { color: var(--text-main); }

            .icon-btn {
                background: var(--surface); border: 1px solid var(--border);
                width: 42px; height: 42px; border-radius: 12px;
                display: flex; align-items: center; justify-content: center;
                cursor: pointer; color: var(--text-main); transition: var(--transition); text-decoration: none;
            }
            .icon-btn:hover { background: var(--surface-hover); transform: translateY(-2px); border-color: #6366f1; }

            .menu-toggle { display: none; }

            .overlay {
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
                opacity: 0; pointer-events: none; transition: var(--transition); z-index: 1500;
            }
            .overlay.active { opacity: 1; pointer-events: all; }

            .mobile-nav {
                position: fixed; top: 0; right: -100%; width: 300px; height: 100vh;
                background: var(--bg); border-left: 1px solid var(--border);
                z-index: 2000; padding: 32px 24px; transition: var(--transition);
                display: flex; flex-direction: column; gap: 12px;
            }
            .mobile-nav.open { right: 0; }
            .mobile-nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
            .mobile-nav-link {
                text-decoration: none; color: var(--text-main); font-size: 18px; font-weight: 600;
                padding: 16px; border-radius: 12px; background: var(--surface);
                display: flex; align-items: center; gap: 12px; transition: var(--transition);
            }

            .container { max-width: 1100px; margin: 0 auto; padding: 120px 24px 60px; }

            .btn {
                padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px;
                cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
                display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
                background: var(--surface); color: var(--text-main);
            }
            .btn:hover { background: var(--surface-hover); transform: translateY(-2px); }
            .btn-primary { background: var(--accent-gradient); color: white; border: none; }

            .form-control {
                background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
                padding: 12px 16px; color: var(--text-main); font-family: inherit; font-size: 14px;
                transition: var(--transition); width: 100%;
            }

            footer { padding: 40px 24px; text-align: center; color: var(--text-dim); font-size: 13px; }

            @media (max-width: 768px) {
                .nav-links { display: none; }
                .menu-toggle { display: flex; }
                nav { padding: 0 20px; }
            }

            {% block extra_style %}{% endblock %}
        </style>
    </head>
    <body>
        <div id="notif-toast-container" style="
            position: fixed;
            top: 90px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        "></div>
        
        <div class="bg-glow"></div>
            <div class="bg-glow"></div>
        <div class="overlay" id="overlay"></div>

        <nav>
            <a href="/" class="brand">
                <i data-lucide="layers" style="width: 24px"></i>
                Serverjonas
            </a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="/memes">Memes</a>
                    <a href="/films">Media</a>
                    <a href="/friends">Freunde</a>
                </div>
                
                <a href="/news" class="icon-btn" title="Benachrichtigungen" style="position: relative;">
                    <i data-lucide="bell" style="width: 20px;"></i>
                    {% if unread_count > 0 %}
                    <span style="
                        position: absolute; top: -6px; right: -6px;
                        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
                        color: white; font-size: 10px; font-weight: 700;
                        width: 18px; height: 18px; border-radius: 50%;
                        display: flex; align-items: center; justify-content: center;
                        font-family: 'Inter', sans-serif;
                    ">{{ unread_count }}</span>
                    {% endif %}
                </a>

                <a href="/settings" class="icon-btn" title="Einstellungen">
                    <i data-lucide="settings" style="width: 20px;"></i>
                </a>
                <button class="icon-btn menu-toggle" id="menuToggle">
                    <i data-lucide="menu"></i>
                </button>
            </div>
        </nav>

        <div class="mobile-nav" id="mobileNav">
            <div class="mobile-nav-header">
                <span class="brand">Menü</span>
                <button class="icon-btn" id="closeMenu">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <a href="/hub" class="mobile-nav-link">
                <i data-lucide="home"></i> Hub
            </a>
            <a href="/memes" class="mobile-nav-link">
                <i data-lucide="image"></i> Memes
            </a>
            <a href="/films" class="mobile-nav-link">
                <i data-lucide="clapperboard"></i> Media
            </a>
            <a href="/friends" class="mobile-nav-link">
                <i data-lucide="users"></i> Freunde
            </a>
            <a href="/news" class="mobile-nav-link">
                <i data-lucide="bell"></i> Benachrichtigungen
                {% if unread_count > 0 %}
                <span style="
                    margin-left: auto;
                    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
                    color: white; font-size: 11px; font-weight: 700;
                    padding: 2px 8px; border-radius: 99px;
                ">{{ unread_count }}</span>
                {% endif %}
            </a>
            <a href="/settings" class="mobile-nav-link" style="margin-top: auto; background: var(--border);">
                <i data-lucide="settings"></i> Einstellungen
            </a>
        </div>

        <div class="container">{% block content %}{% endblock %}</div>

        <footer>
            <div>&copy; 2026 Serverjonas &middot; Version 5.3</div>
        </footer>

        <script>
            (function() {
                const theme = localStorage.getItem("theme") || "dark";
                const style = localStorage.getItem("design-style") || "vibcodet";
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.setAttribute("data-style", style);
            })();

            lucide.createIcons();

            const menuToggle = document.getElementById("menuToggle");
            const closeMenu = document.getElementById("closeMenu");
            const mobileNav = document.getElementById("mobileNav");
            const overlay = document.getElementById("overlay");

            function toggleMenu() {
                mobileNav.classList.toggle("open");
                overlay.classList.toggle("active");
                document.body.style.overflow = mobileNav.classList.contains("open") ? "hidden" : "";
            }

            if (menuToggle) menuToggle.addEventListener("click", toggleMenu);
            if (closeMenu) closeMenu.addEventListener("click", toggleMenu);
            if (overlay) overlay.addEventListener("click", toggleMenu);

        (() => {
            const API_URL = "/api/internal/news";
            const STORAGE_KEY = "serverjonas_notifications_seen";

            function getSeen() {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            }

            function setSeen(data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function toast(text) {
                const container = document.getElementById("notif-toast-container");
                if (!container) return;

                const el = document.createElement("div");
                el.style = `
                    background: var(--surface);
                    border: 1px solid var(--border);
                    padding: 12px 16px;
                    border-radius: 12px;
                    box-shadow: var(--card-shadow);
                    color: var(--text-main);
                    min-width: 260px;
                    transition: all 0.3s ease;
                `;

                el.innerText = text;
                container.appendChild(el);

                setTimeout(() => {
                    el.style.opacity = "0";
                    el.style.transform = "translateY(-10px)";
                    setTimeout(() => el.remove(), 300);
                }, 15000);
            }

            function grouped(count) {
                toast(`Du hast während deiner Abwesenheit ${count} neue Nachrichten bekommen. Schaue sie im News Portal an.`);
            }

            async function syncNews() {
                try {
                    const res = await fetch(API_URL);
                    const data = await res.json();

                    const api = data.notifications || [];
                    const seen = getSeen();

                    const apiIds = new Set(api.map(n => n.id));

                    // 🆕 neue Nachrichten
                    const fresh = api.filter(n => !seen.includes(n.id));

                    // 🧹 entfernte Nachrichten (z.B. gelesen im Portal)
                    const cleaned = seen.filter(id => apiIds.has(id));

                    if (fresh.length > 0) {
                        if (fresh.length > 4) {
                            grouped(fresh.length);
                        } else {
                            fresh.forEach(n => {
                                toast(` ${n.sender_name}: ${n.message}`);
                            });
                        }

                        setSeen([
                            ...cleaned,
                            ...fresh.map(n => n.id)
                        ]);
                    } else {
                        setSeen(cleaned);
                    }

                    // 🔴 Badge update
                    const badge = document.getElementById("notif-badge");
                    if (badge) {
                        if (fresh.length > 0) {
                            badge.style.display = "flex";
                            badge.innerText = fresh.length > 99 ? "99+" : fresh.length;
                        } else {
                            badge.style.display = "none";
                        }
                    }

                } catch (err) {
                    console.error("Notification sync error:", err);
                }
            }

            document.addEventListener("DOMContentLoaded", () => {
                syncNews();
                setInterval(syncNews, 5000);
            });
        })();
        </script>
    </body>
</html>
