{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Anmelden</h1>

{% if message %}
    <p>{{ message }}</p>
{% endif %}

<form method="post" action="/login">
    <label>
        Benutzername:
        <input type="text" name="username" required>
    </label>

    <br><br>

    <label>
        Passwort:
        <input type="password" name="password" required>
    </label>

    <br><br>

    <button type="submit">Login</button>

    &nbsp;&nbsp;

    <a href="/register">
        <button type="button">Noch keinen Account? Erstellen Sie einen.</button>
    </a>
</form>
{% endblock %}
