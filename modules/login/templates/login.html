<!DOCTYPE html>
{% extends "base.html" %}
<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Anmelden</h1>

<form method="post" action="/login">

    <label>
        Benutzername:
        <input type="text" name="username" required>
    </label>

    <br><br>

    <label>
        Passwort:
        <input type="password" name="password" required>
    </label>

    <br><br>

    <button type="submit">Login</button>

</form>

</body>
</html>
